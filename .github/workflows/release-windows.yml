name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.7
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync version and repair workspace
        run: node scripts/sync-version.js

      - name: Install dependencies
        run: bun install

      - name: Validate release inputs
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          CONFIG_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test "$VERSION" = "$CONFIG_VERSION" || {
            echo "Tag $RELEASE_TAG does not match app version $CONFIG_VERSION"
            exit 1
          }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build Windows installer (NSIS & MSI)
        run: bunx tauri build --bundles nsis,msi

      - name: Prepare release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          find src-tauri/target/release/bundle/nsis -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.sig" \) -exec cp {} release-artifacts/ \; 2>/dev/null || true
          find src-tauri/target/release/bundle/msi -type f \( -name "*.msi" -o -name "*.sig" \) -exec cp {} release-artifacts/ \; 2>/dev/null || true

      - name: Keep a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: markd-windows-${{ env.VERSION }}
          path: release-artifacts/
          if-no-files-found: error

      - name: Upload to GitHub release
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "Markd ${VERSION}"
          gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
