name: Release Markd Notes

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Build Tauri Application
        run: npx tauri build --target x86_64-pc-windows-msvc --no-sign

      - name: Create latest.json manifest for Updater
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          $json = @{
            version = $tag
            notes = "Markd $tag"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                url = "https://github.com/diegodesenaesilva-bit/markd-notes/releases/download/$tag/Markd_${ver}_x64-setup.exe"
              }
            }
          } | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText("latest.json", $json, [System.Text.Encoding]::UTF8)

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            latest.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
